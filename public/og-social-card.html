<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WordLord Media — Social Media Portfolio OG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Geist', -apple-system, sans-serif;
      background: #1E3FD8;
    }
    .og-card {
      width: 1200px;
      height: 630px;
      position: relative;
      background: radial-gradient(circle at 72% 52%, #2a52f5 0%, #1E3FD8 50%, #10268e 100%);
      color: #ffffff;
      padding: 56px 64px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .og-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.45;
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 0.8px, transparent 0.9px);
      background-size: 3.5px 3.5px;
    }
    
    /* Header */
    .og-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    .og-logo {
      height: 38px;
      width: auto;
    }
    .og-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.8);
    }
    .og-badge {
      padding: 5px 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 11.5px;
      letter-spacing: 0.05em;
      color: #ffffff;
    }

    /* Main editorial section */
    .og-body {
      position: relative;
      z-index: 2;
      max-width: 650px;
      margin-top: 10px;
    }
    .og-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: 68px;
      line-height: 1.02;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 24px;
    }

    /* Stats display */
    .og-stats {
      display: flex;
      align-items: flex-start;
      gap: 40px;
      margin-bottom: 28px;
    }
    .og-stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .og-num {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 54px;
      line-height: 1;
      color: #ffffff;
      font-weight: 400;
    }
    .og-lbl {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.01em;
    }

    /* Thumbnail reel strip */
    .og-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: 480px;
    }
    .og-shot {
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 14px 28px -10px rgba(0, 10, 40, 0.6);
      aspect-ratio: 9 / 16;
      height: 110px;
      background: #000;
    }
    .og-shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Footer info */
    .og-foot {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 24px;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.75);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 18px;
      max-width: 650px;
    }
    .og-foot-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .og-foot-item b {
      color: #ffffff;
      font-weight: 600;
    }

    /* Mascot grounding on the right */
    .mascot-wrap {
      position: absolute;
      right: 25px;
      bottom: 0;
      height: 560px;
      width: 440px;
      z-index: 1;
      pointer-events: none;
    }
    .mascot-ground-shadow {
      position: absolute;
      bottom: 0;
      left: 40px;
      width: 360px;
      height: 26px;
      background: radial-gradient(ellipse at 50% 50%, rgba(5, 12, 45, 0.65) 0%, rgba(5, 12, 45, 0.25) 50%, transparent 75%);
      filter: blur(5px);
    }
    .mascot-img {
      position: absolute;
      bottom: -10px;
      right: 0;
      height: 100%;
      width: auto;
      object-fit: contain;
      object-position: bottom right;
      filter: drop-shadow(0 14px 25px rgba(0, 15, 60, 0.3)) drop-shadow(0 30px 50px rgba(0, 10, 40, 0.4));
    }
  </style>
</head>
<body>
  <div class="og-card">
    <header class="og-head">
      <img src="assets/wl-logo.png" alt="WordLord Media" class="og-logo">
      <div class="og-meta">
        <span>MEDIA &amp; REACH · 2026</span>
        <span class="og-badge">20 MANAGED ACCOUNTS</span>
      </div>
    </header>

    <div class="og-body">
      <h1 class="og-title">Social media<br>we run.</h1>
      
      <div class="og-stats">
        <div class="og-stat">
          <span class="og-num">464K</span>
          <span class="og-lbl">views on a single reel</span>
        </div>
        <div class="og-stat">
          <span class="og-num">13</span>
          <span class="og-lbl">reels past 100K views</span>
        </div>
        <div class="og-stat">
          <span class="og-num">20</span>
          <span class="og-lbl">active client handles</span>
        </div>
      </div>

      <div class="og-strip">
        <div class="og-shot"><img src="assets/social/p1travels/1.jpg" alt="P1 Travels"></div>
        <div class="og-shot"><img src="assets/social/vaasii.in/1.jpg" alt="Vaasii"></div>
        <div class="og-shot"><img src="assets/social/ozasco.in/1.jpg" alt="The Ozasco"></div>
        <div class="og-shot"><img src="assets/social/pindauraindia/1.jpg" alt="The Pindaura"></div>
      </div>
    </div>

    <footer class="og-foot">
      <div class="og-foot-item">
        <span>Book Strategy Call:</span>
        <b>calendar.wordlordmedia.com</b>
      </div>
      <div class="og-foot-item">
        <span>Verified Play Counts:</span>
        <b>11 Nov 2026</b>
      </div>
    </footer>

    <div class="mascot-wrap">
      <div class="mascot-ground-shadow"></div>
      <img src="assets/mascot/elephant-phone.png" alt="WordLord Elephant Mascot" class="mascot-img">
    </div>
  </div>
</body>
</html>
